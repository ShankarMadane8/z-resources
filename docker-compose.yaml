version: '3.8'

services:

  # ================= EUREKA =================
  eureka-server:
    build:
      context: ../service-registry
      dockerfile: ../service-registry/Dockerfile
    image: eureka-server:1.0
    container_name: eureka-server
    ports:
      - "8761:8761"

  # ================= ADMIN =================
  admin-server:
    build:
      context: ../admin-server
      dockerfile: ../admin-server/Dockerfile
    image: admin-server:1.0
    container_name: admin-server
    ports:
      - "1111:1111"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka

  # ================= CONFIG SERVER =================
  config-server:
    build:
      context: ../config-server
      dockerfile: ../config-server/Dockerfile
    image: config-server:1.0
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ================= ZIPKIN =================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"

  # ================= ZOOKEEPER =================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ================= KAFKA =================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ================= AKHQ =================
  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    ports:
      - "9099:8080"
    depends_on:
      - kafka
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka:9092"

  # ================= REDIS =================
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"

  # ================= API GATEWAY =================
  api-gateway-service:
    build:
      context: ../api-gateway
      dockerfile: ../api-gateway/Dockerfile
    image: api-gateway:1.0
    container_name: api-gateway
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans

  # ================= WELCOME SERVICE =================
  welcome-service:
    build:
      context: ../welcome-service
      dockerfile: ../welcome-service/Dockerfile
    image: welcome-service:1.0
    container_name: welcome-service
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379

  # ================= MYSQL (GREET SERVICE) =================
  mysql-greet:
    image: mysql:8.0
    container_name: mysql-greet
    restart: always
    environment:
      MYSQL_DATABASE: greetdb
      MYSQL_USER: greetuser
      MYSQL_PASSWORD: greetpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - greet_mysql_data:/var/lib/mysql

  # ================= GREET SERVICE =================
  greet-service:
    build:
      context: ../greet-service
      dockerfile: ../greet-service/Dockerfile
    image: greet-service:1.0
    container_name: greet-service
    ports:
      - "9091:9091"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      mysql-greet:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-greet:3306/greetdb
      - SPRING_DATASOURCE_USERNAME=greetuser
      - SPRING_DATASOURCE_PASSWORD=greetpass
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379

volumes:
  greet_mysql_data:


